default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# The Homebrew install links storage/ to a directory outside the app, so the
# database and cached thumbnails survive upgrades.
production:
  <<: *default
  database: storage/production.sqlite3
